description:
  en: 'Durable task-decomposition plans for DeepSeek Harness with a self-learning loop: every department subtask runs in three ordered phases (plan, execute, verify), the verify phase must submit a retrospective of problems, detours and resolutions, and that retrospective is written to a permanent lessons file, ranked against the new subtask and injected into later dispatches so the same mistake is not repeated. Adds a read-only dsh_workplan_lessons tool (14 model tools in total), a progress panel drawn as a ring, a stacked bar and per-stage steps, and a public ISO/IEC 15408:2026 security self-assessment with zero runtime dependencies. Now upgraded with extreme token savings and high-reliability delivery: 90%+ cross-subtask KV prefix-cache hit rate, streamlined single-session execution with 71% smaller tool surface and billing-weighted budgets, compaction-proof anti-drift anchors, a 1-step grace window with automatic evidence salvage so completed work is never lost, and instant main-agent wake-up without blind waiting.'
  zh: '为 DeepSeek Harness 提供持久化任务分解计划，并加入自我学习闭环：每个部门子任务按「计划→执行→验证」三阶段推进，验证阶段必须提交问题、弯路与解决方式的复盘，写入永久教训记忆文件，下次派发时按部门与关键词排序注入，避免重犯。新增只读 dsh_workplan_lessons 工具（共 14 个模型工具）、环形图/四段构成条/逐阶段步进条进度面板，以及按 ISO/IEC 15408:2026 结构编写的公开安全自评估——每条声明都可被读者核对，零运行时依赖。最新升级极致省 Token 与高可靠交付：跨子任务共享前缀使 KV 缓存命中率达 90%+，默认精简冗余回合与 71% 无用工具说明，按真实花钱权重控预算；内置系统级防跑偏锚点（长对话压缩不失忆）、1 步优雅交卷宽限窗与成果自动打捞（干完 99% 绝不白干），以及子任务完成即时唤醒主 Agent（告别盲目死等）。'