url: https://github.com/KunKun24/dsh-sidebar-editor
name: KunKun24/dsh-sidebar-editor
category: ui
description:
  en: 'Adds an Edit sidebar entry to the More menu that opens a centered, scrollable dialog for switching individual sidebar buttons off. Hidden rows leave the rail but stay listed under Hidden in the same menu, so nothing is lost; state is kept in localStorage and reapplied on every load.'
  zh: 在左侧栏「更多」菜单里加「编辑侧边栏」，点开是居中弹窗，可上下滚动地逐个关掉侧栏按钮。关掉的整行从侧栏消失，但仍列在「更多」的「已隐藏」里，随时点得回来；开关存在浏览器本地，刷新后依然生效。
icon: https://raw.githubusercontent.com/KunKun24/dsh-sidebar-editor/main/assets/icon-180.png
tarball: https://github.com/KunKun24/dsh-sidebar-editor/releases/download/v0.2.1/dsh-sidebar-editor-0.2.1.tgz
