description:
  en: 'Call between DSH sessions in different working directories or projects: message any session (next-step delivery or a new turn), end a blocking tool call on request, and read transcripts and usage without waking the target. Resume the initiating chat after a Windows Desktop restart, with confirmation when other chats are active.'
  zh: '在不同目录 / 项目的 DSH 会话之间通话：向任意会话发消息（下一步直达或开新轮），可按需结束对方阻塞中的工具调用，并在不唤醒对方的情况下读取记录与用量。Windows 桌面重启后可自动续接原会话，其他会话活动时弹窗确认。'
