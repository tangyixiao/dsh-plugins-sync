url: https://github.com/Daaaaavid-zhou/dsh-camera
name: Daaaaavid-zhou/dsh-camera
category: vision
description:
  en: Lets DeepSeek access the camera directly, supports one-click photo capture into the input box, and bundles a Mac camera app. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 让 DeepSeek 直接访问摄像头，支持一键拍照导入输入框，附带一个 Mac 相机软件。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
icon: https://raw.githubusercontent.com/Daaaaavid-zhou/dsh-camera/main/assets/icon-180.png
