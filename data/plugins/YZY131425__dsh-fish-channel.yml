url: https://github.com/YZY131425/dsh-fish-channel
name: YZY131425/dsh-fish-channel
category: notify
description:
  en: School channel plugin for DSH that binds a workspace or session and delivers school messages, notices, and wake-ups; unmatched sessions hold messages instead of spending tokens. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 学校通道插件：绑定 DSH 工作区/会话，投递学校消息、通知与主动唤醒；匹配不到会话时先压着，不丢消息、不花 token。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
