name: qiuyunhui666-sketch/dsh-freedomchat
category: ui
description:
  en: A chat-only side panel in the right sidebar with an isolated context, no local execution, its own model, two-way reading only with explicit consent, and deletion together with an archived session. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 在主对话右侧栏开一个独立的纯聊天面板：不继承上下文、没有任何本地执行权限，可自选模型与推理强度，双向读取必须经你明确授权，并随主对话归档自动删除。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
