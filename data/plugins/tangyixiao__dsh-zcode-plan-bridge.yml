url: https://github.com/tangyixiao/dsh-zcode-plan-bridge
name: tangyixiao/dsh-zcode-plan-bridge
category: model
description:
  en: "Requires the ZCode CLI installed and signed in. Relays the ZCode CLI agent into DeepSeek Harness as a model provider. A resident app-server session streams each turn, and the model catalogue is read from the CLI at runtime, so context windows, image support and provider routes follow the installed CLI and account. Stable 0.7.1 supports DSH 0.2.2-rc.5, uses native ZCode profile sign-in and catalog selection for Start Plan, displays completed native tasks, child tasks and message boundaries, adds a bilingual toolkit with optional Z·SWITCH saved-account controls (independent DSH or shared login), next-request quota switching with default post-drain continuation on independent rotation, and canonical context-overflow handling. Session titles are generated in disposable native sessions. Quota rotation recognizes attributed Start Plan code 1005 with the exact exceed quota limit message. When standalone app-server explicitly returns an empty native catalog (such as newer host-fed Desktop kernels), 0.7.1 stops before generation with an actionable INVALID_CONFIG diagnostic and marks empty catalogs as hard failures in doctor/models. Tool permission requests are denied by default; unknown approval or permission methods are always denied, and full-auto requires an explicit opt-in. DSH approval UI does not mediate this separately spawned app-server process, and the policy is not an OS sandbox. Derived from kyle123740/dsh-zcode-cli-proxy (AGPL-3.0); it registers the same `zcode-cli` provider id, so it cannot be installed alongside the original. Its HTTP routes first require the synchronous connection.requestRejection Host/Origin policy, then connection.admit owner admission; missing, throwing, malformed or asynchronous checks fail closed."
  zh: "需已安装并登录 ZCode CLI。把 ZCode CLI agent 接入 DeepSeek Harness 作为模型提供方。常驻 app-server 会话逐回合流式转发，模型清单从 CLI 实时读取，因此上下文窗口、图片支持与 provider 路由均跟随已安装的 CLI 和账号。稳定版 0.7.1 支持 DSH 0.2.2-rc.5，使用 ZCode 原生独立账号登录与会话模型目录，在对话中显示已完成的原生任务清单、子任务与消息分段，提供中英文工具箱及可选 Z·SWITCH 账号管理（默认独立 DSH 模式、共同登录可选），启用独立轮换后在确认额度耗尽时默认等后台工具收尾并换号续跑，并正确识别上下文超限与 Start Plan 结构化额度耗尽错误 1005。会话标题通过独立临时原生会话生成。当独立启动的 app-server 显式返回空模型目录（例如改为桌面端投喂账号配置的新内核）时，0.7.1 会在发送生成请求前以 INVALID_CONFIG 明确提示原因，并在 doctor/models 中将其标为硬失败。工具权限请求默认拒绝；未知的 approval/permission 方法始终拒绝，全自动需显式启用。DSH 自带的审批界面不会介入这个独立 spawn 的 app-server 进程，该策略也不构成操作系统沙箱。派生自 kyle123740/dsh-zcode-cli-proxy（AGPL-3.0），注册相同的 `zcode-cli` provider id，不能与原版同装。HTTP 路由先执行同步 connection.requestRejection 宿主请求策略，再经 connection.admit 验证 owner；检查缺失、抛错、畸形或异步返回时均拒绝访问。"
