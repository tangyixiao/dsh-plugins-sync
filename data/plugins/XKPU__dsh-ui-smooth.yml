url: https://github.com/XKPU/dsh-ui-smooth
name: XKPU/dsh-ui-smooth
category: ui
description:
  en: 'Keeps the UI smooth: moves other plugins'' idle animations off per-frame layout, recycles old transcript turns, unloads history by window to free memory, and allows turning off background throttling. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 让 UI 保持流畅：把其他插件的空闲动画移出每帧布局、回收旧轮次、按窗口卸载历史以释放内存，并允许关闭后台节流。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
