name: A18953901111/dsh-agentflow
category: workflow
description:
  en: 'Declarative multi-agent workflow engine for DeepSeek Harness: YAML templates compile to orchestration scripts with hard agent budgets, verified citation anchors, run artifacts and a sidebar panel. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 声明式多智能体工作流引擎：把 YAML 模板编译成编排脚本，带硬性 agent 预算、引用锚点核查、运行产物与侧栏面板。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
