description:
  en: 'Family health workspace for DeepSeek Harness: record vitals, labs and body composition for up to 8 family members; manage metabolic and lean-muscle goals across 12-week cycles with behaviour accounts, weekly ledgers and a copyable visit summary; tag meal photos with the 2022 Chinese dietary guideline groups; generate privacy-aware daily, weekly and settlement cards locally; keep a health archive of trends, photos and medical documents; and browse a Hangzhou Yuhang venue pilot. Records only; no diagnosis, treatment or medication advice.'
  zh: 'DeepSeek Harness 的家庭健康工作台：为最多 8 位家庭成员记录体征、化验与体成分；用行为账户与周对账按 12 周周期管理代谢与薄肌目标，可导出可复制的就诊摘要；餐食照片按《中国居民膳食指南（2022）》七组标注；本地生成带隐私开关的日报、周报与结算卡；归档趋势、照片与病历；并内置杭州余杭区场馆试点。仅做记录，不提供诊断、治疗或用药建议。'
