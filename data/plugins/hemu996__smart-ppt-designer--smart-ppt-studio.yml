name: hemu996/smart-ppt-designer#国赛PPT设计台
category: ui
description:
  en: 'Competition-grade PPT design console for DeepSeek Harness, paired with the smart-ppt-designer skill: 19 visual systems to retrieve by content, 29 hard red lines that a failing design must be rebuilt against, a 13-step workflow, 32 ready commands, 18 animation recipes and 95 catalogued templates. Import a local .pptx and it extracts the cover and summarises the deck structure (page outline, imagery and data it expects, theme colours); templates are browsed with inline thumbnails, and one click copies the assembled generation brief for the skill to execute. Latest (1.9.2): the whole effects library now ships inside the plugin — 22 recipes (ppt-effects v1.3.0) with their reference decks, ~47 MB, so installing this is enough and the separate skill is no longer required for motion. Every effect is labelled by what it actually does: 4 inject page-level timing, 11 add a generic morph transition, 8 need to be generated from the recipe.'
  zh: '国赛/创赛级 PPT 设计台，配合 smart-ppt-designer 技能使用：19 套视觉系统按内容检索、29 条硬红线（违反即返工）、13 步工作流、32 条命令、18 条动效、95 份模板清单。导入本地 .pptx 会自动抽取封面，并生成结构速览（页面框架、需要的素材与数据、主题色）；模板内联缩略图预览，一键复制组装好的生成指令交给技能执行。最新 1.9.2：整套动效库随插件内置——22 个效果（ppt-effects v1.3.0）连同参考件约 47MB，装上即用，不再需要另外安装技能。每条效果按实测能力标注：4 条可一键注入页内动画，11 条只注入平滑切换，8 条需按配方生成。'
icon: https://raw.githubusercontent.com/hemu996/smart-ppt-designer/main/smart-ppt-studio/icon-180.png
