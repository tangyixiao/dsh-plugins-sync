url: https://github.com/Earnest-R/dsh-reed-pet
name: Earnest-R/dsh-reed-pet
category: fun
description:
  en: A desktop pet for DeepSeek Harness that sits on the composer edge, with idle actions, per-line voice clips, replaceable sprites, drag, color themes, and local DeepSeek balance and usage tracking. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 挂在 DeepSeek Harness 输入框上边框的桌宠：会自己走动、坐下、打盹，被戳时有动作和台词； 支持逐条台词配语音、整套替换形象、拖动和菜单配色，并在本地显示 DeepSeek 余额、 峰谷时段、今日消耗与每轮花费。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
icon: https://raw.githubusercontent.com/Earnest-R/dsh-reed-pet/main/assets/icon.png
