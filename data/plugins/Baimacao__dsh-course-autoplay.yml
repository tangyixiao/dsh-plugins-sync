name: Baimacao/dsh-course-autoplay
category: browser
icon: https://raw.githubusercontent.com/Baimacao/dsh-course-autoplay/main/assets/icon-180.png
description:
  en: 'Online-course autoplay: drives a logged-in browser through course videos, advances lesson by lesson, learns each site''s page structure into a replay-verified profile, and keeps a plan document plus a visual panel of per-site progress. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: DSH 网课挂机：用已登录的浏览器自动播完课程并推进到下一节，站点页面结构靠嗅探加复探自适应并沉淀成可复用经验，附带计划文档与逐站进度的可视化面板。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
