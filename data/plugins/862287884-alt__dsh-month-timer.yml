name: 862287884-alt/dsh-month-timer
category: ui
description:
  en: A monthly progress bar docked above the composer that logs hand-entered minutes and seconds as coloured stages against a workday-derived target, with paper, frosted-glass or fully transparent backdrops. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 停在输入框上方的月度进度条：手填「分:秒」与备注记成彩色阶段，节点按当月工作日 × 2 或 × 3 分钟折算，背景可选纸面、毛玻璃或透明。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
