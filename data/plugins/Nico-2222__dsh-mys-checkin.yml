url: https://github.com/Nico-2222/dsh-mys-checkin
name: Nico-2222/dsh-mys-checkin
category: tools
description:
  en: 'Daily check-in for MiYoushe (米游社) across six miHoYo games (mainland China servers only): Genshin Impact, Honkai: Star Rail, Zenless Zone Zero, Honkai Impact 3rd, Tears of Themis and Honkai Gakuen 2. QR-code login plus manual cookie binding for devices that cannot scan, a sidebar entry, per-game selection, an optional 米游币 community check-in for the 原神 and 大别野 forums (sign-in only, never comments or likes), a daily schedule with random jitter and startup catch-up, and four agent tools. Credentials stay on the local machine (mode 0600) and are never sent anywhere but the official miHoYo API. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 米游社六个游戏每日签到（仅限国服：原神 / 崩坏：星穹铁道 / 绝区零 / 崩坏3 / 未定事件簿 / 崩坏学园2）：面板内扫码登录，扫不了码时可手动粘贴 cookie；提供侧边栏入口、按游戏勾选、可选的米游币讨论区签到（原神 / 大别野，只签到不评论不点赞）、每日定时（带随机延迟与启动补签），以及四个 agent 工具。凭证仅存本机（0600），除官方接口外不会发往任何地方。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
icon: https://raw.githubusercontent.com/Nico-2222/dsh-mys-checkin/main/assets/icon-180.png
