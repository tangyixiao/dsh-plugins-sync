description:
  en: 'DSH Agentrix delegates tool work in strict mode and tracks evidence-based acceptance. Version 1.8.5 records background command results on the original task, reconciles jobs on reload, and supports one-click plan cancellation on DSH Desktop 0.2.2-rc.5. Verified on Windows with PowerShell 7 (pwsh) and Git; other systems are untested. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH Agentrix 在严格模式下委派工具任务，按验证证据验收。1.8.5 将后台命令结果回填到原任务卡，重载后核对原作业，并支持在 DSH Desktop 0.2.2-rc.5 一次确认取消计划。验证覆盖 Windows、PowerShell 7（pwsh）和 Git。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
