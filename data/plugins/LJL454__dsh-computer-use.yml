description:
  en: Windows computer-use tools for DeepSeek Harness, with screen capture, UI Automation, background browsing, and separate Windows child sessions for supported apps. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 为 DeepSeek Harness 提供 Windows 电脑操作工具，支持截图、UI 自动化、后台浏览器，以及通过独立 Windows 子会话运行已接入的应用。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
