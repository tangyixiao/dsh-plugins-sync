url: https://github.com/feigo313/dsh-leader
name: feigo313/dsh-leader
category: workflow
description:
  en: Injects a leader contract into the root session so the main agent plans, slices the work, delegates to subagents and verifies their output; checks the [ROUTE] header and the declared model/effort of every dispatch (off, audit or enforce), watches for the main agent doing implementation work itself, and records it all in an audit log. Ships a plugin-detail settings surface (subagent guide with one-click access to DSH's official Subagent page, gate strictness, archive and input-bar toggle-visibility cards), a one-click robot toggle in the chat input bar to enable or disable per-session orchestration, and a local HTTP API. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 给根会话注入 Leader 合同，让主代理做统筹、切片、派活与验收；核对每次派活的 [ROUTE] 头与声明的 model/effort（off/audit/enforce），检测主代理是否自己动手改文件，并写入审计日志；提供插件详情页设置面（子代理引导卡可一键直达官方子智能体页，另有门禁强度、归档与输入栏开关显示卡）、聊天输入栏一键启停会话级编排的机器人按钮，以及本地 HTTP API。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
icon: https://raw.githubusercontent.com/feigo313/dsh-leader/main/assets/icon-180.png
