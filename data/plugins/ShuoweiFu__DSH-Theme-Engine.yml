url: https://github.com/ShuoweiFu/DSH-Theme-Engine
name: ShuoweiFu/DSH-Theme-Engine
category: theme
description:
  en: A high-performance WebGL liquid glass plugin made for DeepSeek Harness. It features domain distortion, chromatic refraction, and a 5-layer GPU overheat protection system. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 为 DeepSeek Harness 打造的高性能 WebGL 液态玻璃插件。内含域扭曲、色散折射与 5 层显卡防过热机制。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
