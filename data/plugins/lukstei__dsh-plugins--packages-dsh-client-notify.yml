url: https://github.com/lukstei/dsh-plugins/tree/main/packages/dsh-client-notify
name: lukstei/dsh-plugins#dsh-client-notify
category: notify
description:
  en: Triggers desktop notifications, a chime, and PWA app-icon badges when a session stops or waits for approval. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 在会话停止或等待审批时发送桌面通知、播放提示音，并更新 PWA 应用角标计数。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
