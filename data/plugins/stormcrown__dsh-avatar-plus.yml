url: https://github.com/stormcrown/dsh-avatar-plus
name: stormcrown/dsh-avatar-plus
category: ui
description:
  en: Adds AI and user avatars to DSH chat, with import-and-crop upload, per-session and per-subagent overrides, configurable hover cards, and a right-sidebar tab that merges the main AI with its subagents into one timeline. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 给 DSH 对话加 AI 与用户头像：导入即裁切、可按会话与子智能体单独覆盖、头像悬停大图，并在右侧边栏开一个把主 AI 与子智能体合并的时间线 TAB。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
icon: https://raw.githubusercontent.com/stormcrown/dsh-avatar-plus/main/assets/group-icon.png
