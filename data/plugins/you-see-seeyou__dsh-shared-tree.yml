url: https://github.com/you-see-seeyou/dsh-shared-tree
name: you-see-seeyou/dsh-shared-tree
category: tools
description:
  en: Manage the cross-profile shared plugin tree at <DSH_HOME>/profiles/node_modules - install npm packages into the shared tree with hoisted builds and dependency closure, search it, verify package hashes, and toggle which shared bundles each profile loads. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 管理 <DSH_HOME>/profiles/node_modules 跨 profile 共享插件树：hoisted 构建装包、依赖闭包合并、sha256 复核、按 profile 启停 bundle，并带只读侧边栏面板。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
