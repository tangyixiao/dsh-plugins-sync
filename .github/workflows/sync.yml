name: Sync catalogs and markets

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write # Explicit post-merge CI dispatch; bot pushes do not trigger push CI.
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Fetch only upstream data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: awesome-dsh-plugin/awesome-dsh-plugin
          ref: main
          path: work/upstream
          sparse-checkout: data
          persist-credentials: false
      - name: Refresh full catalog and preserve reviewed corrections
        shell: bash
        run: |
          upstream_sha=$(git -C work/upstream rev-parse HEAD)
          npm run sync:catalog -- --source-dir work/upstream --source-ref "$upstream_sha"
      - name: Refresh all configured market indexes
        id: markets
        continue-on-error: true
        run: npm run sync:markets
      - name: Check syntax, regressions and complete snapshot integrity
        run: |
          npm run check:syntax
          npm test
          npm run validate
      - name: Audit dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/
      - name: Publish and automatically merge validated data updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data plugins.json RANKING.md README.md package.json catalog-snapshot.json markets market-plugins.json
          if git diff --cached --quiet; then
            echo 'All source content is unchanged; no update PR needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Imported YAML keeps upstream bytes, including its original whitespace.
          git diff --cached --check -- . ':!data/plugins/**'
          tree=$(git write-tree)
          parents=(-p "$(git rev-parse HEAD)")
          branch='automation/catalog-sync'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch --no-tags origin "$branch"
            previous=$(git rev-parse FETCH_HEAD)
            if [ "$previous" != "$(git rev-parse HEAD)" ]; then
              parents+=(-p "$previous")
            fi
          fi
          commit=$(git commit-tree "$tree" "${parents[@]}" \
            -m 'chore(sync): refresh catalog and market snapshots' \
            -m 'Maintained-by: Tangyixiao <115929632+tangyixiao@users.noreply.github.com>' \
            -m 'Data-sources: markets.config.json; LICENSE.list-data; LICENSE.market-data' \
            -m 'Co-authored-by: Tangyixiao <115929632+tangyixiao@users.noreply.github.com>')
          git push origin "$commit:refs/heads/$branch"
          cp markets/README.md work/sync-pr-body.md
          printf '\nGenerated by GitHub Actions; maintained by [Tangyixiao](https://github.com/tangyixiao).\nFull catalog and source indexes passed regression and integrity checks in this run.\nOnly fresh, validated, generated-data updates are merged automatically.\n' >> work/sync-pr-body.md
          # Keep the recognized co-author trailer last in the merge commit body too.
          printf '\nCo-authored-by: Tangyixiao <115929632+tangyixiao@users.noreply.github.com>\n' >> work/sync-pr-body.md
          existing=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title 'chore(sync): refresh catalog and market snapshots' --body-file work/sync-pr-body.md
          else
            gh pr create --base main --head "$branch" --title 'chore(sync): refresh catalog and market snapshots' --body-file work/sync-pr-body.md
            existing=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          fi
          cat markets/README.md >> "$GITHUB_STEP_SUMMARY"
          node scripts/merge-sync.mjs "$existing" "$(git rev-parse HEAD)" "$commit"
          # GITHUB_TOKEN merges do not trigger push CI, so request it explicitly.
          gh workflow run ci.yml --ref main
          printf '\nValidated data automatically merged through PR #%s. Post-merge Ubuntu/Windows CI dispatched.\n' "$existing" >> "$GITHUB_STEP_SUMMARY"
      - name: Report any failed market fetches
        if: steps.markets.outcome == 'failure'
        run: |
          echo 'One or more market fetches failed. Valid previous snapshots were retained where available; see markets/status.json and the update PR.'
          exit 1
